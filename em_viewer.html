<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>电磁传播仿真工作台 — 郑州局域</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e14;color:#e6edf3;
            font-family:"Microsoft YaHei",system-ui,sans-serif;font-size:13px}
  #app{position:fixed;inset:0}
  .panel{position:fixed;background:rgba(13,17,23,.9);border:1px solid #232b36;
         border-radius:10px;padding:10px 13px;backdrop-filter:blur(8px);line-height:1.7}
  #left{left:12px;top:12px;bottom:12px;width:310px;overflow-y:auto}
  #right{right:12px;top:12px;width:250px}
  #bottom{left:338px;bottom:12px;right:274px}
  h3{margin:2px 0 8px;font-size:14px;color:#58a6ff}
  label{display:block;margin:6px 0 2px;color:#8b949e;font-size:12px}
  input,select{width:100%;box-sizing:border-box;background:#0d1117;color:#e6edf3;
        border:1px solid #30363d;border-radius:5px;padding:4px 7px;font-size:12px;
        font-family:inherit}
  input[type=checkbox]{width:auto}
  button{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:6px;
         padding:5px 11px;cursor:pointer;font-size:12px;font-family:inherit;margin:3px 3px 0 0}
  button:hover{background:#30363d;border-color:#8b949e}
  button.pri{background:#1f6feb;border-color:#1f6feb}
  button.pri:hover{background:#388bfd}
  button:disabled{opacity:.45;cursor:not-allowed}
  .src{border:1px solid #30363d;border-radius:7px;padding:7px 9px;margin:6px 0;cursor:pointer}
  .src.sel{border-color:#58a6ff;background:#111a26}
  .src .nm{font-weight:600}
  .src .sub{color:#8b949e;font-size:11px}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  #legend .bar{height:12px;border-radius:3px;margin:4px 0}
  #status{color:#d29922;min-height:18px;font-size:12px}
  .k{color:#8b949e}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:#0b0e14;font-size:15px;z-index:9;text-align:center;line-height:2}
  code{color:#7ee787;background:#161b22;padding:1px 4px;border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>
<div id="load">正在加载 city_model.glb …</div>

<div id="left" class="panel">
  <h3>信号源</h3>
  <div id="srclist"></div>
  <button class="pri" id="addSrc">+ 新增信号源</button>
  <button id="pickMode">在地图上点选位置</button>
  <div id="status"></div>

  <h3 style="margin-top:14px">源参数</h3>
  <label>名称</label><input id="s_name" value="源-1">
  <div class="row">
    <div><label>E (m)</label><input id="s_x" type="number" value="0" step="10"></div>
    <div><label>N (m)</label><input id="s_y" type="number" value="-300" step="10"></div>
  </div>
  <label>天线离地高 AGL (m)</label><input id="s_agl" type="number" value="30" step="5">
  <label>频段预设</label><select id="s_band"></select>
  <div class="row">
    <div><label>频率 (MHz)</label><input id="s_f" type="number" value="900" step="1"></div>
    <div><label>功率 (dBm)</label><input id="s_p" type="number" value="30" step="1"></div>
  </div>
  <div class="row">
    <div><label>带宽 (MHz)</label><input id="s_bw" type="number" value="1" step="0.1"></div>
    <div><label>噪声系数 (dB)</label><input id="s_nf" type="number" value="6" step="0.5"></div>
  </div>

  <h3 style="margin-top:14px">天线</h3>
  <label>方向图</label>
  <select id="s_pat"><option value="omni">全向</option><option value="dir">定向</option></select>
  <div class="row">
    <div><label>增益 (dBi)</label><input id="s_g" type="number" value="6" step="0.5"></div>
    <div><label>方位角 (°)</label><input id="s_az" type="number" value="0" step="5"></div>
  </div>
  <div class="row">
    <div><label>下倾角 (°)</label><input id="s_el" type="number" value="0" step="5"></div>
    <div><label>水平波束 (°)</label><input id="s_hpbw" type="number" value="65" step="5"></div>
  </div>

  <h3 style="margin-top:14px">计算</h3>
  <div class="row">
    <div><label>方位划分数</label><input id="c_az" type="number" value="1440" step="360"></div>
    <div><label>距离步长 (m)</label><input id="c_dr" type="number" value="5" step="1"></div>
  </div>
  <label>接收点离地高 (m)</label><input id="c_hr" type="number" value="1.5" step="0.5">
  <button class="pri" id="run" style="margin-top:9px;width:100%">开始仿真</button>
</div>

<div id="right" class="panel">
  <h3>覆盖 (dBm)</h3>
  <div class="bar" id="cbar"></div>
  <div class="row" style="font-size:11px;color:#8b949e">
    <span id="vlo"></span><span style="text-align:right" id="vhi"></span>
  </div>
  <label><input type="checkbox" id="showCov" checked> 显示覆盖层</label>
  <label><input type="checkbox" id="flatMode"> 去地形（平面模式）</label>
  <label><input type="checkbox" id="ghostBld" checked> 平面模式下建筑半透明</label>
  <button id="topBtn" style="width:100%;margin-top:7px">⟱ 一键俯视</button>
  <button id="resetBtn" style="width:100%">复位斜视</button>
  <label style="margin-top:8px">结果统计</label>
  <div id="stats" class="k" style="font-size:11.5px;line-height:1.85"></div>
</div>

<div id="bottom" class="panel">
  <span class="k">左键旋转 · <b>中键平移</b> · 右键平移 · 滚轮缩放 · 双击复位 ·
  点「在地图上点选位置」后单击模型放置源</span>
</div>

<script type="importmap">
{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 10, 400000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI*0.495; controls.screenSpacePanning = true;
controls.mouseButtons = {LEFT:THREE.MOUSE.ROTATE, MIDDLE:THREE.MOUSE.PAN, RIGHT:THREE.MOUSE.PAN};

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x3a4a34, 0.9));
const key = new THREE.DirectionalLight(0xfff4e2, 1.6);
key.position.set(-0.35,0.78,0.52).multiplyScalar(10000); scene.add(key);
const f1 = new THREE.DirectionalLight(0x9dc4ff, 0.7);
f1.position.set(0.8,0.36,-0.46).multiplyScalar(10000); scene.add(f1);

let root=null, buildings=null, terrain=null, home=null, META=null;
const MARKERS = new THREE.Group(); scene.add(MARKERS);
let covMesh=null, covTex=null, covGrid=null, covQ=null, covLos=null, covVmin=0;
let covBaseY=null, covFlatY=0;          // 覆盖层顶点的原始高度 / 压平后的高度
let flatMode=false, isTop=false;

function place(x,y){ return new THREE.Vector3(x, 0, -y); }   // ENU(E,N) → three(x,·,z=-N)

function frameObject(obj){
  const box=new THREE.Box3().setFromObject(obj), size=box.getSize(new THREE.Vector3());
  const c=box.getCenter(new THREE.Vector3()), radius=size.length()*0.5;
  const fit=Math.min(1,camera.aspect)/Math.min(1,1.6);
  const dist=radius/Math.sin(THREE.MathUtils.degToRad(camera.fov*0.5))*0.55*(0.75+0.25*fit);
  const dir=new THREE.Vector3(-0.48,0.50,0.72).normalize();
  camera.position.copy(c).addScaledVector(dir,dist);
  camera.near=Math.max(1,dist/8000); camera.far=dist*20; camera.updateProjectionMatrix();
  controls.target.copy(c); controls.minDistance=radius*0.005; controls.maxDistance=radius*14;
  controls.update(); home={pos:camera.position.clone(),tgt:c.clone()};
}

new GLTFLoader().load('city_model.glb', gltf=>{
  root=gltf.scene;
  root.traverse(o=>{ if(!o.isMesh) return;
    o.material=new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
    const n=(o.name||'').toLowerCase();
    if(n.includes('terrain')) terrain=o; else if(n.includes('building')) buildings=o; });
  scene.add(root); frameObject(root);
  document.getElementById('load').style.display='none';
}, undefined, err=>{
  document.getElementById('load').innerHTML = '<div><b style="color:#f85149">加载失败：'+err+
    '</b><br><br>请通过 <code>start_em.bat</code> 启动服务后访问。</div>';
});

// ---------------- 场景元信息 ----------------
fetch('/api/scene').then(r=>r.json()).then(m=>{ META=m; }).catch(()=>{});
fetch('/api/bands').then(r=>r.json()).then(bs=>{
  const sel=document.getElementById('s_band');
  sel.innerHTML='<option value="">— 自定义 —</option>'+
    bs.map((b,i)=>`<option value="${i}">${b.name} (${(b.f0/1e6).toFixed(0)} MHz)</option>`).join('');
  sel.onchange=()=>{ if(sel.value===''){return;}
    const b=bs[+sel.value];
    document.getElementById('s_f').value=(b.f0/1e6).toFixed(1);
    document.getElementById('s_bw').value=(b.bw/1e6).toFixed(2); };
}).catch(()=>{});

// ---------------- 信号源管理 ----------------
let sources=[]; let selIdx=-1; let pickMode=false;
const $=id=>document.getElementById(id);

function renderList(){
  $('srclist').innerHTML = sources.map((s,i)=>
    `<div class="src ${i===selIdx?'sel':''}" data-i="${i}">
       <div class="nm">${s.name||('源-'+(i+1))}</div>
       <div class="sub">E ${s.x.toFixed(0)} · N ${s.y.toFixed(0)} · AGL ${s.agl} m<br>
        ${(s.f_hz/1e6).toFixed(1)} MHz · ${s.p_tx_dbm} dBm · ${s.pat==='dir'?'定向':'全向'}</div>
     </div>`).join('') || '<div class="k" style="font-size:12px">还没有信号源</div>';
  [...document.querySelectorAll('.src')].forEach(el=>el.onclick=()=>{
    selIdx=+el.dataset.i; loadForm(); renderList(); drawMarkers(); });
}

function loadForm(){
  const s=sources[selIdx]; if(!s) return;
  $('s_name').value=s.name||''; $('s_x').value=s.x; $('s_y').value=s.y; $('s_agl').value=s.agl;
  $('s_f').value=(s.f_hz/1e6).toFixed(2); $('s_p').value=s.p_tx_dbm;
  $('s_bw').value=(s.bw_hz/1e6).toFixed(2); $('s_nf').value=s.nf_db;
  $('s_pat').value=s.pat; $('s_g').value=s.gain_dbi; $('s_az').value=s.az_deg;
  $('s_el').value=s.el_deg; $('s_hpbw').value=s.hpbw_h;
}
function saveForm(){
  const s=sources[selIdx]; if(!s) return;
  s.name=$('s_name').value; s.x=+$('s_x').value; s.y=+$('s_y').value; s.agl=+$('s_agl').value;
  s.f_hz=(+$('s_f').value)*1e6; s.p_tx_dbm=+$('s_p').value;
  s.bw_hz=(+$('s_bw').value)*1e6; s.nf_db=+$('s_nf').value;
  s.pat=$('s_pat').value; s.gain_dbi=+$('s_g').value; s.az_deg=+$('s_az').value;
  s.el_deg=+$('s_el').value; s.hpbw_h=+$('s_hpbw').value;
  renderList(); drawMarkers();
}
['s_name','s_x','s_y','s_agl','s_f','s_p','s_bw','s_nf','s_pat','s_g','s_az','s_el','s_hpbw']
  .forEach(id=>$(id).oninput=saveForm);

$('addSrc').onclick=()=>{
  sources.push({name:'源-'+(sources.length+1), x:0, y:-300, agl:30,
    f_hz:900e6, p_tx_dbm:30, bw_hz:1e6, nf_db:6, pat:'omni',
    gain_dbi:6, az_deg:0, el_deg:0, hpbw_h:65});
  selIdx=sources.length-1; loadForm(); renderList(); drawMarkers();
};
$('pickMode').onclick=()=>{ pickMode=!pickMode;
  $('pickMode').textContent = pickMode? '点选中…（再点取消）' : '在地图上点选位置'; };

function drawMarkers(){
  while(MARKERS.children.length) MARKERS.remove(MARKERS.children[0]);
  sources.forEach((s,i)=>{
    const g=new THREE.Group();
    const h = (terrain? 120 : 120);
    const col = i===selIdx? 0xffd54a : 0x58a6ff;
    const mast=new THREE.Mesh(new THREE.CylinderGeometry(6,6,90,8),
      new THREE.MeshBasicMaterial({color:col}));
    mast.position.set(s.x,110,s.y*-1+ (s.y*2));  // 占位，下面重设
    mast.position.set(s.x, 160, -s.y);
    g.add(mast);
    const ball=new THREE.Mesh(new THREE.SphereGeometry(22,14,12),
      new THREE.MeshBasicMaterial({color:col}));
    ball.position.set(s.x, 215, -s.y); g.add(ball);
    MARKERS.add(g);
  });
}

// 点选放置
const ray=new THREE.Raycaster();
renderer.domElement.addEventListener('click', ev=>{
  if(!pickMode || !terrain) return;
  const r=renderer.domElement.getBoundingClientRect();
  const ndc=new THREE.Vector2(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc, camera);
  const hit=ray.intersectObject(terrain, false);
  if(!hit.length) return;
  const p=hit[0].point;
  if(selIdx<0){ $('addSrc').onclick(); }
  $('s_x').value=p.x.toFixed(1); $('s_y').value=(-p.z).toFixed(1);
  saveForm(); drawMarkers();
  $('status').textContent='已放置：E '+p.x.toFixed(0)+' N '+(-p.z).toFixed(0);
});

// ---------------- 仿真 ----------------
let polling=null;
$('run').onclick=async ()=>{
  if(selIdx<0){ $('status').textContent='请先添加并选中一个信号源'; return; }
  saveForm();
  const s=sources[selIdx];
  $('run').disabled=true; $('status').textContent='提交中…';
  const body={ source:{x:s.x,y:s.y,agl:s.agl,f_hz:s.f_hz,p_tx_dbm:s.p_tx_dbm,
                       bw_hz:s.bw_hz,nf_db:s.nf_db,pat:s.pat,gain_dbi:s.gain_dbi,
                       az_deg:s.az_deg,el_deg:s.el_deg,hpbw_h:s.hpbw_h},
               h_recv:+$('c_hr').value, n_az:+$('c_az').value, d_r:+$('c_dr').value,
               nx:900, ny:500 };
  try{
    const r=await fetch('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},
                                        body:JSON.stringify(body)});
    const {jobId}=await r.json();
    if(!jobId){ $('status').textContent='提交失败'; $('run').disabled=false; return; }
    pollJob(jobId);
  }catch(e){ $('status').textContent='提交出错：'+e; $('run').disabled=false; }
};

function pollJob(id){
  clearInterval(polling);
  polling=setInterval(async ()=>{
    try{
      const j=await (await fetch('/api/job/'+id)).json();
      $('status').textContent='计算中：'+(j.phase||'')+'  '+Math.round((j.progress||0)*100)+'%';
      if(j.status==='done'){
        clearInterval(polling);
        const res=await (await fetch('/api/result/'+id)).json();
        showResult(res); $('status').textContent='完成'; $('run').disabled=false;
      } else if(j.status==='error'){
        clearInterval(polling);
        $('status').textContent='失败：'+String(j.error).split('\n').pop();
        $('run').disabled=false;
      }
    }catch(e){ clearInterval(polling); $('status').textContent='轮询出错'; $('run').disabled=false; }
  }, 600);
}

function b64u16(b64){ const bin=atob(b64); const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Uint16Array(a.buffer); }

function showResult(R){
  covGrid=R.grid; covVmin=R.vmin_dbm; covQ=b64u16(R.b64);
  covLos=null;
  const {nx,ny}=R.grid;
  covQ = covQ.slice(0, nx*ny);

  // 色标（turbo 近似）
  const STOPS=[[0,'#30123b'],[0.15,'#4145ab'],[0.3,'#4675ed'],[0.45,'#39a2fc'],
               [0.6,'#1bcfd4'],[0.72,'#62fc6b'],[0.85,'#e1dd37'],[0.93,'#fe9b2d'],[1,'#7a0403']];
  $('cbar').style.background='linear-gradient(90deg,'+STOPS.map(s=>s[1]).join(',')+')';
  $('vlo').textContent=R.vmin_dbm.toFixed(0);
  $('vhi').textContent=R.stats.p_max.toFixed(0);
  const st=R.stats;
  $('stats').innerHTML =
    `视距占比 <b>${(st.los_frac*100).toFixed(1)}%</b><br>`+
    `视距中位 ${st.p_median_los!=null?st.p_median_los.toFixed(1):'—'} dBm<br>`+
    `非视距中位 ${st.p_median_nlos!=null?st.p_median_nlos.toFixed(1):'—'} dBm<br>`+
    `噪声底 ${st.noise_floor_dbm.toFixed(1)} dBm<br>`+
    `可检测占比 <b>${(st.detectable_frac*100).toFixed(1)}%</b>`;

  buildCoverageMesh(R);
}

function buildCoverageMesh(R){
  if(covMesh){ scene.remove(covMesh); covMesh.geometry.dispose(); covMesh.material.dispose(); }
  const H=R.heights, hx=H.nx, hy=H.ny;
  const bin=atob(H.b64); const ab=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) ab[i]=bin.charCodeAt(i);
  const hz=new Float32Array(ab.buffer);

  const nx=R.grid.nx, ny=R.grid.ny;
  // 服务端发的是 uint16 量化值(0.1 dB)，这里解成 float32。
  // 关键：不能用 RedFormat+UnsignedShortType —— 那是整数纹理，WebGL 不支持
  // 对整数纹理做线性过滤，采样会整片失效（表现为覆盖层完全不显示）。
  const fdata=new Float32Array(covQ.length);
  for(let i=0;i<covQ.length;i++){
    fdata[i] = covQ[i] > 0 ? R.vmin_dbm + covQ[i]*0.1 : -999.0;
  }
  const tex=new THREE.DataTexture(fdata, nx, ny, THREE.RedFormat, THREE.FloatType);
  tex.needsUpdate=true; tex.minFilter=THREE.LinearFilter; tex.magFilter=THREE.LinearFilter;
  covTex=tex;

  // 贴地网格：用稀疏地形高度采样成 (hy-1)x(hx-1) 的平面
  const g=new THREE.PlaneGeometry(1,1, hx-1, hy-1);
  const pos=g.attributes.position;
  const x0=R.grid.x0, y0=R.grid.y0, x1=x0+nx*R.grid.dx, y1=y0+ny*R.grid.dy;
  let k=0, zsum=0;
  covBaseY = new Float32Array(hx*hy);
  for(let j=0;j<hy;j++){
    for(let i=0;i<hx;i++){
      const fx=x0+(i+0.5)/hx*(x1-x0), fy=y0+(j+0.5)/hy*(y1-y0);
      const z=hz[j*hx+i];
      // PlaneGeometry 的顶点顺序是由上到下、由左到右
      const vi=(hy-1-j)*hx+i;
      pos.setXYZ(vi, fx, z+2.0, -fy);
      covBaseY[vi]=z+2.0; zsum+=z;
      k++;
    }
  }
  covFlatY = zsum/k + 3.0;          // 压平到地面平均高度 +3 m
  g.computeVertexNormals();
  const mat=new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:0.78,
    depthWrite:false, polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4,
    side:THREE.DoubleSide});
  // 片元里把 uint16 映射成颜色（用色标 LUT）
  mat.onBeforeCompile=(sh)=>{
    sh.uniforms.uVmin={value:R.vmin_dbm};
    sh.uniforms.uVmax={value:R.stats.p_max};
    sh.uniforms.uLosOnly={value:0};
    sh.fragmentShader='uniform float uVmin; uniform float uVmax; uniform float uLosOnly;\n'+
      sh.fragmentShader.replace('#include <map_fragment>', `
        float dbm = texture2D(map, vMapUv).r;
        float t = clamp((dbm - uVmin) / max(uVmax - uVmin, 1e-3), 0.0, 1.0);
        // turbo 近似
        vec3 c0=vec3(0.19,0.07,0.23), c1=vec3(0.25,0.27,0.67), c2=vec3(0.27,0.46,0.93);
        vec3 c3=vec3(0.22,0.64,0.99), c4=vec3(0.11,0.81,0.83), c5=vec3(0.38,0.99,0.42);
        vec3 c6=vec3(0.88,0.87,0.22), c7=vec3(1.00,0.61,0.18), c8=vec3(0.48,0.02,0.01);
        vec3 col = t<0.125? mix(c0,c1,t/0.125) : t<0.25? mix(c1,c2,(t-0.125)/0.125)
                 : t<0.375? mix(c2,c3,(t-0.25)/0.125) : t<0.5? mix(c3,c4,(t-0.375)/0.125)
                 : t<0.625? mix(c4,c5,(t-0.5)/0.125) : t<0.75? mix(c5,c6,(t-0.625)/0.125)
                 : t<0.875? mix(c6,c7,(t-0.75)/0.125) : mix(c7,c8,(t-0.875)/0.125);
        diffuseColor.rgb = col;
        diffuseColor.a = (dbm < -900.0) ? 0.0 : 0.78;
      `);
  };
  covMesh=new THREE.Mesh(g, mat);
  covMesh.renderOrder=2;
  scene.add(covMesh);
  if(flatMode) applyFlatMode(true);   // 新结果沿用当前的平面/贴地模式
}

$('showCov').onchange=e=>{ if(covMesh) covMesh.visible=e.target.checked; };

// ---------------- 去地形（平面模式） / 俯视 ----------------
function applyFlatMode(on){
  flatMode=on;
  if(terrain) terrain.visible = !on;
  if(buildings){
    const g = on && $('ghostBld').checked;
    buildings.material.transparent = !!g;
    buildings.material.opacity = g? 0.14 : 1.0;
    buildings.material.depthWrite = !g;
    buildings.material.needsUpdate = true;
  }
  // 覆盖层在「贴地」与「压平到同一高度」之间切换
  if(covMesh && covBaseY){
    const pos=covMesh.geometry.attributes.position;
    for(let i=0;i<covBaseY.length;i++) pos.setY(i, on? covFlatY : covBaseY[i]);
    pos.needsUpdate=true;
    covMesh.geometry.computeBoundingSphere();
    // 平面模式下覆盖层会被半透明建筑盖住，改用叠加式混合并置顶
    covMesh.material.depthTest = !on;
    covMesh.material.blending = on? THREE.NormalBlending : THREE.NormalBlending;
    covMesh.renderOrder = on? 9 : 2;
    covMesh.material.needsUpdate=true;
  }
}

function topView(){
  if(!root) return;
  const box=new THREE.Box3().setFromObject(root);
  const c=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const half=Math.max(size.x, size.z)*0.5;
  const tv=Math.tan(THREE.MathUtils.degToRad(camera.fov)*0.5);
  const dV=half/tv, dH=half/(tv*camera.aspect);
  const dist=Math.max(dV,dH)*1.06;
  // 正上方时默认 up=(0,1,0) 与视线共线会退化，改成 up=-Z 让北朝上
  camera.up.set(0,0,-1);
  controls.maxPolarAngle=Math.PI;
  camera.position.set(c.x, c.y+dist, c.z+0.001);
  camera.near=Math.max(1,dist/8000); camera.far=dist*20;
  camera.updateProjectionMatrix();
  controls.target.copy(c); controls.update();
  isTop=true;
}

function resetView(){
  camera.up.set(0,1,0);
  controls.maxPolarAngle=Math.PI*0.495;
  if(home){ camera.position.copy(home.pos); controls.target.copy(home.tgt); }
  camera.updateProjectionMatrix(); controls.update();
  isTop=false;
}

$('flatMode').onchange=e=>applyFlatMode(e.target.checked);
$('ghostBld').onchange=()=>{ if(flatMode) applyFlatMode(true); };
$('topBtn').onclick=topView;
$('resetBtn').onclick=resetView;

$('c_hr').oninput=()=>{};
$('s_x').oninput=saveForm; $('s_y').oninput=saveForm;

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.domElement.addEventListener('dblclick', resetView);

(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene,camera); })();
</script>
</body>
